<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="title desc"><title id="title">Corrupt world D̂ · before GST</title><desc id="desc">Byzantine leader: sends 0 to A, B, C and 1 to E. D sends 0-votes to C and simulates M outside C. C decides 0; E decides 1.</desc><rect width="960" height="370" rx="16" fill="#f5f7fa"/><g font-family="Arial, sans-serif" fill="#172b4d"><text x="30" y="42" font-size="25" font-weight="bold">Corrupt world D̂ · before GST</text><text x="30" y="78" font-size="17">Byzantine leader: sends 0 to A, B, C and 1 to E.</text><rect x="30" y="108" width="170" height="130" rx="10" fill="#e7f0fc" stroke="#91a3bb"/><text x="115" y="147" text-anchor="middle" font-size="28" font-weight="bold">A</text><text x="115" y="182" text-anchor="middle" font-size="18">p parties</text><text x="115" y="216" text-anchor="middle" font-size="17">0 · correct</text><rect x="212" y="108" width="170" height="130" rx="10" fill="#e7f0fc" stroke="#91a3bb"/><text x="297" y="147" text-anchor="middle" font-size="28" font-weight="bold">B</text><text x="297" y="182" text-anchor="middle" font-size="18">f − 1 parties</text><text x="297" y="216" text-anchor="middle" font-size="17">0 · correct</text><rect x="394" y="108" width="170" height="130" rx="10" fill="#e7f0fc" stroke="#91a3bb"/><text x="479" y="147" text-anchor="middle" font-size="28" font-weight="bold">C</text><text x="479" y="182" text-anchor="middle" font-size="18">f + c − 1 parties</text><text x="479" y="216" text-anchor="middle" font-size="17">0 · correct</text><rect x="576" y="108" width="170" height="130" rx="10" fill="#fff1df" stroke="#91a3bb"/><text x="661" y="147" text-anchor="middle" font-size="28" font-weight="bold">D</text><text x="661" y="182" text-anchor="middle" font-size="18">f − 1 parties</text><text x="661" y="216" text-anchor="middle" font-size="17">Byzantine</text><rect x="758" y="108" width="170" height="130" rx="10" fill="#e7f0fc" stroke="#91a3bb"/><text x="843" y="147" text-anchor="middle" font-size="28" font-weight="bold">E</text><text x="843" y="182" text-anchor="middle" font-size="18">p parties</text><text x="843" y="216" text-anchor="middle" font-size="17">1 · correct</text><text x="30" y="275" font-size="17">Delayed: every C → outside message, and every E → C message.</text><text x="30" y="310" font-size="17" transform="translate(0 0)">D sends 0-votes to C and simulates M outside C. C decides 0; E decides 1.</text></g></svg>